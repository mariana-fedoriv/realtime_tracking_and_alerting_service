services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    # Raise max_connections so 4 app workers × (pool_size=10 + max_overflow=20) = 120
    # connections fit comfortably inside the Postgres limit.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo_tracking
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:55432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://geo:geo@db:5432/geo_tracking
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://geo:geo@db:5432/geo_tracking
      REDIS_URL: redis://redis:6379/0
    # 4 independent uvicorn processes, each with its own event loop, connection
    # pool, and ingestion worker pool. Redis pub/sub fanout already handles
    # cross-process WebSocket delivery, so no other changes are needed.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    ports:
      - "8000:8000"

volumes:
  db_data:
